<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>مدرّب الإملاء - Spelling Practice App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ltr {
            direction: ltr;
        }
        /* Mobile layout adjustments */
        input {
            -webkit-appearance: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between select-none">

    <!-- Header / Top Bar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50 pt-safe">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-mobile-screen-button text-2xl text-indigo-200"></i>
                <h1 class="text-lg font-bold">مدرّب السبلينق</h1>
            </div>
            <div id="statsBadge" class="bg-indigo-700 text-indigo-100 text-xs px-3 py-1.5 rounded-full font-semibold shadow-inner">
                0 كلمات
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="max-w-xl mx-auto px-3 py-4 w-full flex-grow pb-12">
        
        <!-- Navigation Tabs (Optimized for Touch) -->
        <div class="grid grid-cols-2 gap-1 mb-4 bg-white p-1 rounded-2xl shadow-sm border border-slate-200/80">
            <button id="tabPractice" onclick="switchTab('practice')" class="py-3 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow">
                <i class="fa-solid fa-gamepad text-base"></i> التكرار والإملاء
            </button>
            <button id="tabManage" onclick="switchTab('manage')" class="py-3 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2 text-slate-600 hover:text-indigo-600">
                <i class="fa-solid fa-list-check text-base"></i> إدارة الكلمات
            </button>
        </div>

        <!-- PRACTICE SECTION -->
        <section id="practiceSection" class="block">
            <!-- Empty State -->
            <div id="emptyWarning" class="hidden bg-amber-50 border border-amber-200 p-6 rounded-2xl shadow-sm text-amber-900 text-center my-4">
                <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500 mb-3"></i>
                <h3 class="text-lg font-bold mb-1">القائمة فارغة حالياً!</h3>
                <p class="text-xs text-amber-700 mb-4">أضف بعض الكلمات التي تريد التدرب عليها للبدء.</p>
                <button onclick="switchTab('manage')" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white py-3 rounded-xl font-bold text-sm shadow transition">
                    إضافة كلمات جديدة
                </button>
            </div>

            <!-- Active Practice Card -->
            <div id="practiceCard" class="bg-white rounded-3xl shadow-md border border-slate-200/60 p-5 text-center">
                
                <div class="flex justify-between items-center text-xs text-slate-500 mb-4 pb-2 border-b border-slate-100">
                    <span id="progressText" class="font-medium bg-slate-100 px-2.5 py-1 rounded-md">الكلمة 1 من 10</span>
                    <span id="streakCount" class="text-emerald-600 font-bold bg-emerald-50 px-2.5 py-1 rounded-md">
                        <i class="fa-solid fa-fire text-amber-500"></i> السلسلة: 0
                    </span>
                </div>

                <!-- Word Hint (Arabic Translation) -->
                <div class="my-4 py-2">
                    <span class="text-xs font-semibold text-slate-400 block mb-1">المعنى بالعربية</span>
                    <h2 id="arabicMeaning" class="text-2xl sm:text-3xl font-black text-slate-800 leading-tight">--</h2>
                </div>

                <!-- Touch-friendly Audio Button -->
                <button type="button" onclick="playCurrentWordAudio()" class="w-full active:scale-95 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 px-4 rounded-2xl transition flex items-center justify-center gap-2 mb-5 border border-indigo-100">
                    <i class="fa-solid fa-volume-high text-xl text-indigo-600 animate-pulse"></i>
                    <span class="text-sm">استمع لنطق الكلمة (Listen)</span>
                </button>

                <!-- Input Form for Mobile -->
                <form id="spellingForm" onsubmit="checkSpelling(event)" class="space-y-3">
                    <div class="relative">
                        <!-- Mobile keyboard helpers: autocapitalize=none, autocorrect=off, spellcheck=false -->
                        <input type="text" 
                               id="userInput" 
                               autocomplete="off" 
                               autocorrect="off" 
                               autocapitalize="none" 
                               spellcheck="false" 
                               placeholder="اكتب الإملاء هنا..." 
                               class="w-full text-center text-xl sm:text-2xl font-mono tracking-wider py-3.5 px-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-600 focus:outline-none transition bg-slate-50 focus:bg-white ltr shadow-inner">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full active:scale-95 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-2xl transition shadow-md shadow-indigo-200 text-base">
                        تحقق من الإجابة
                    </button>
                </form>

                <!-- Feedback Toast -->
                <div id="feedback" class="mt-4 hidden p-4 rounded-2xl text-center font-bold text-sm"></div>

                <!-- Next Button -->
                <button id="nextBtn" onclick="nextWord()" class="mt-4 hidden w-full active:scale-95 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-6 rounded-2xl transition text-base">
                    الكلمة التالية <i class="fa-solid fa-arrow-left mr-2"></i>
                </button>
            </div>
        </section>

        <!-- MANAGE SECTION -->
        <section id="manageSection" class="hidden">
            <!-- Add Word Box -->
            <div class="bg-white p-5 rounded-3xl shadow-md border border-slate-200/60 mb-6">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-600 text-lg"></i> إضافة كلمة جديدة
                </h2>
                <form onsubmit="addNewWord(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الكلمة بالإنجليزية (English)</label>
                        <input type="text" id="newWordEn" required autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="مثال: Schedule" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:outline-none text-sm ltr bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الترجمة بالعربية (Arabic)</label>
                        <input type="text" id="newWordAr" required autocomplete="off" placeholder="مثال: جدول أوقات" class="w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:outline-none text-sm bg-slate-50">
                    </div>
                    <button type="submit" class="w-full active:scale-95 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md flex justify-center items-center gap-2 text-sm mt-2">
                        <i class="fa-solid fa-plus"></i> إضافة إلى التمارين
                    </button>
                </form>
            </div>

            <!-- Words List for Mobile -->
            <div class="bg-white rounded-3xl shadow-md border border-slate-200/60 p-5">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h2 class="text-base font-bold text-slate-800">كلماتك المضافة</h2>
                    <button onclick="loadDefaultWords()" class="text-xs text-indigo-600 hover:underline font-bold">
                        استعادة العينة الافتراضية
                    </button>
                </div>
                
                <div id="wordsMobileList" class="space-y-2">
                    <!-- Dynamic cards for mobile view -->
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500 sticky bottom-0 z-40">
        مدرّب السبلينق التفاعلي 🚀 - مخصص للجوال
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Sample default words
        const defaultWords = [
            { id: '1', english: 'curious', arabic: 'فضولي / شغوف' },
            { id: '2', english: 'famous', arabic: 'مشهور' },
            { id: '3', english: 'shivering', arabic: 'يرتعش' },
            { id: '4', english: 'missing', arabic: 'مفقود' },
            { id: '5', english: 'amazed', arabic: 'مذهل / مندهش' },
            { id: '6', english: 'swim', arabic: 'يسبح' },
            { id: '7', english: 'distance', arabic: 'مسافة' },
            { id: '8', english: 'rough', arabic: 'خشن / قاسي' },
            { id: '9', english: 'heart', arabic: ' قلب ' },
            { id: '10', english: 'die', arabic: 'الموت' },
            { id: '11', english: 'freckles', arabic: 'النمش' },
            { id: '12', english: 'headaches', arabic: 'الصداع' },
            { id: '13', english: 'success', arabic: 'نجاح' },
            { id: '14', english: 'operation', arabic: 'عملية' },
            { id: '15', english: 'peace', arabic: 'سلام' },
            { id: '16', english: 'dizzy', arabic: 'دوار / دائخ' },
            { id: '17', english: 'kidding', arabic: 'يمازح / يمزح' },
            { id: '18', english: 'rushed', arabic: 'متسرع' },
            { id: '19', english: 'sharp', arabic: 'حاد' },
            { id: '20', english: 'checkup', arabic: 'فحص' },
        
        ];

        // App state
        let wordsList = JSON.parse(localStorage.getItem('spellingWords')) || defaultWords;
        let currentIndex = 0;
        let streak = 0;

        // Initialize App on DOM Ready
        document.addEventListener('DOMContentLoaded', () => {
            saveWordsToStorage();
            updateStats();
            renderWordsList();
            startPracticeSession();
        });

        // Save data to localStorage
        function saveWordsToStorage() {
            localStorage.setItem('spellingWords', JSON.stringify(wordsList));
            updateStats();
        }

        // Update top badge count
        function updateStats() {
            document.getElementById('statsBadge').innerText = `${wordsList.length} كلمات في قائمتك`;
        }

        // Tab Switcher
        function switchTab(tabName) {
            const practiceSection = document.getElementById('practiceSection');
            const manageSection = document.getElementById('manageSection');
            const tabPractice = document.getElementById('tabPractice');
            const tabManage = document.getElementById('tabManage');

            if (tabName === 'practice') {
                practiceSection.classList.remove('hidden');
                manageSection.classList.add('hidden');
                tabPractice.className = 'py-3 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow';
                tabManage.className = 'py-3 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2 text-slate-600 hover:text-indigo-600';
                startPracticeSession();
            } else {
                practiceSection.classList.add('hidden');
                manageSection.classList.remove('hidden');
                tabManage.className = 'py-3 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white shadow';
                tabPractice.className = 'py-3 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2 text-slate-600 hover:text-indigo-600';
            }
        }

        // TTS Audio Engine with Mobile Gesture compatibility
        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Reset speech queue
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Natural slower pace for learning
                window.speechSynthesis.speak(utterance);
            }
        }

        function playCurrentWordAudio() {
            if (wordsList.length > 0 && wordsList[currentIndex]) {
                playAudio(wordsList[currentIndex].english);
            }
        }

        // Start / Setup Card
        function startPracticeSession() {
            const emptyWarning = document.getElementById('emptyWarning');
            const practiceCard = document.getElementById('practiceCard');

            if (wordsList.length === 0) {
                emptyWarning.classList.remove('hidden');
                practiceCard.classList.add('hidden');
                return;
            }

            emptyWarning.classList.add('hidden');
            practiceCard.classList.remove('hidden');

            if (currentIndex >= wordsList.length) {
                currentIndex = 0; // Loop list
            }

            const currentWord = wordsList[currentIndex];
            document.getElementById('arabicMeaning').innerText = currentWord.arabic;
            document.getElementById('progressText').innerText = `الكلمة ${currentIndex + 1} من ${wordsList.length}`;
            
            const userInput = document.getElementById('userInput');
            userInput.value = '';
            userInput.disabled = false;

            document.getElementById('feedback').className = 'mt-4 hidden p-4 rounded-2xl text-center font-bold text-sm';
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');

            // Play word sound on load
            playCurrentWordAudio();
        }

        // Check Spelling
        function checkSpelling(e) {
            e.preventDefault();
            const userInput = document.getElementById('userInput');
            const inputVal = userInput.value.trim().toLowerCase();
            const targetWord = wordsList[currentIndex].english.trim().toLowerCase();
            const feedback = document.getElementById('feedback');
            const submitBtn = document.getElementById('submitBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (!inputVal) return;

            feedback.classList.remove('hidden');

            if (inputVal === targetWord) {
                // Correct
                streak++;
                feedback.className = 'mt-4 p-4 rounded-2xl text-center font-bold text-sm bg-emerald-100 text-emerald-800 border border-emerald-300';
                feedback.innerHTML = `<i class="fa-solid fa-circle-check text-lg ml-1"></i> إجابة صحيحة ممتاز! <br><span class="font-mono text-base font-black tracking-wider text-emerald-900">${wordsList[currentIndex].english}</span>`;
                
                userInput.disabled = true;
                submitBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');
            } else {
                // Wrong
                streak = 0;
                feedback.className = 'mt-4 p-4 rounded-2xl text-center font-bold text-sm bg-rose-100 text-rose-800 border border-rose-300';
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark text-lg ml-1"></i> تحتاچ تكرار! الإملاء الصحيح: <br><span class="font-mono text-base font-black tracking-wider text-rose-900 underline">${wordsList[currentIndex].english}</span>`;
                
                userInput.disabled = true;
                submitBtn.classList.add('hidden');
                nextBtn.classList.remove('hidden');

                // Re-queue incorrect word for practice repetition
                wordsList.push(wordsList[currentIndex]);
                updateStats();
            }

            document.getElementById('streakCount').innerHTML = `<i class="fa-solid fa-fire text-amber-500"></i> السلسلة: ${streak}`;
        }

        // Next word
        function nextWord() {
            currentIndex++;
            startPracticeSession();
        }

        // Render Words for Mobile Management Section
        function renderWordsList() {
            const container = document.getElementById('wordsMobileList');
            container.innerHTML = '';

            if (wordsList.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">لا توجد كلمات في قائمتك.</div>`;
                return;
            }

            wordsList.forEach((word) => {
                const card = document.createElement('div');
                card.className = 'flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100';
                card.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <button onclick="playAudio('${word.english}')" class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center active:scale-90 transition">
                            <i class="fa-solid fa-volume-high text-sm"></i>
                        </button>
                        <div>
                            <div class="font-mono font-bold text-slate-800 text-base ltr text-right">${word.english}</div>
                            <div class="text-xs text-slate-500">${word.arabic}</div>
                        </div>
                    </div>
                    <button onclick="deleteWord('${word.id}')" class="text-rose-400 hover:text-rose-600 p-2 active:scale-90 transition">
                        <i class="fa-solid fa-trash-can text-base"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function addNewWord(e) {
            e.preventDefault();
            const enInput = document.getElementById('newWordEn');
            const arInput = document.getElementById('newWordAr');

            const newEntry = {
                id: Date.now().toString(),
                english: enInput.value.trim(),
                arabic: arInput.value.trim()
            };

            wordsList.unshift(newEntry);
            saveWordsToStorage();
            renderWordsList();

            enInput.value = '';
            arInput.value = '';
            enInput.focus();
        }

        function deleteWord(id) {
            wordsList = wordsList.filter(item => item.id !== id);
            saveWordsToStorage();
            renderWordsList();
        }

        function loadDefaultWords() {
            wordsList = [...defaultWords];
            saveWordsToStorage();
            renderWordsList();
        }
    </script>
</body>
</html>
